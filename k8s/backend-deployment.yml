apiVersion: apps/v1
kind: Deployment
metadata:
  name: devbord-backend-deployment
  namespace: devboard
  labels:
    app: devboard-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devboard-backend
  template:
    metadata:
      labels:
        app: devboard-backend
    spec:
      containers:
      - name: devboard-backend
        image:  trainwithshubham/devboard-backend:latest
        ports:
        - containerPort: 8080

